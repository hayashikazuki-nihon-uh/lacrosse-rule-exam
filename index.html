<title>ラクロス審判員（女子4級）試験対策</title>

<style>
:root{
  --paper:#F5F6F2; --surface:#FFFFFF; --ink:#1E2023; --muted:#5A6067; --line:#D6D9D2;
  --flag:#E5B41E; --flag-ink:#1E2023; --turf:#2C6A4D; --turf-soft:#E3EFE8; --red:#B5352C; --red-soft:#F7E4E2;
  --stripe-a:#1E2023; --stripe-b:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#16181B; --surface:#202327; --ink:#ECEDEA; --muted:#A4A9AF; --line:#34383D;
    --flag:#EEC23A; --flag-ink:#16181B; --turf:#62B98E; --turf-soft:#1E3329; --red:#E46A60; --red-soft:#3A2321;
    --stripe-a:#ECEDEA; --stripe-b:#202327;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#16181B; --surface:#202327; --ink:#ECEDEA; --muted:#A4A9AF; --line:#34383D;
  --flag:#EEC23A; --flag-ink:#16181B; --turf:#62B98E; --turf-soft:#1E3329; --red:#E46A60; --red-soft:#3A2321;
  --stripe-a:#ECEDEA; --stripe-b:#202327;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  font-size:16px; line-height:1.75; -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 64px}
.stripes{height:14px;background:repeating-linear-gradient(90deg,var(--stripe-a) 0 14px,var(--stripe-b) 14px 28px);border-bottom:1px solid var(--line)}
header.top{padding:28px 0 8px}
header.top h1{font-size:clamp(1.55rem,4.6vw,2.1rem);line-height:1.3;margin:0;font-weight:900;letter-spacing:.01em}
header.top p{margin:8px 0 0;color:var(--muted);font-size:.95rem}
.rules{display:flex;flex-wrap:wrap;gap:8px 18px;margin:14px 0 0;padding:0;list-style:none;font-size:.92rem}
.rules b{font-weight:900;font-size:1.15rem;margin-right:2px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:4px;margin:20px -4px 24px;padding:8px 4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{flex:1 0 auto;font:inherit;font-weight:700;font-size:.95rem;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--flag)}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
h2{font-size:1.3rem;line-height:1.4;margin:0 0 6px;font-weight:900}
h3{font-size:1.05rem;margin:28px 0 8px;font-weight:700}
.lead{color:var(--muted);margin:0 0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:700;border-radius:8px;padding:10px 18px;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.flag{background:var(--flag);border-color:var(--flag);color:var(--flag-ink)}
.btn{white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* schedule */
.examdate{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:20px}
.examdate input{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:6px 10px;min-height:40px}
.note{font-size:.9rem;color:var(--muted);margin:6px 0 0}
.days{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.day{display:grid;grid-template-columns:72px 1fr auto;gap:4px 14px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line)}
.day .dn{font-weight:900;font-size:1.05rem;line-height:1.3}
.day .dn small{display:block;font-weight:500;font-size:.78rem;color:var(--muted)}
.day .what b{display:block;font-weight:700}
.day .what span{display:block;font-size:.88rem;color:var(--muted)}
.day .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.day .acts .btn{padding:6px 12px;min-height:38px;font-size:.9rem}
.check{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--turf)}
.day.done .what b{text-decoration:line-through;text-decoration-color:var(--muted)}
.day.today{background:linear-gradient(90deg,color-mix(in srgb,var(--flag) 18%,transparent),transparent 70%)}
.phase{font-size:.85rem;font-weight:700;color:var(--muted);padding:18px 0 4px}
@media (max-width:520px){.day{grid-template-columns:56px 1fr}.day .acts{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start}}

table.nums{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:8px}
table.nums th,table.nums td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.nums th{font-weight:700;color:var(--muted);font-size:.82rem}
table.nums td:nth-child(2){font-weight:900;white-space:nowrap}
.tblwrap{overflow-x:auto}

/* units */
.units{list-style:none;margin:0;padding:0}
.unit{display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.unit b{font-weight:700}
.unit small{color:var(--muted);font-size:.82rem}
.meter{grid-column:1/-1;height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--turf)}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.88rem;color:var(--muted);margin-bottom:10px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 20px;margin-bottom:16px}
.qcard .qt{font-size:1.12rem;line-height:1.85;font-weight:500;margin:0}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.yn button{font-size:1.25rem;font-weight:900;padding:16px 10px;border-radius:12px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;min-height:64px}
.yn button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.yn button.right{background:var(--turf);border-color:var(--turf);color:#fff}
.yn button.wrong{background:var(--red);border-color:var(--red);color:#fff}
.yn button:disabled{cursor:default}
.fb{border-left:5px solid var(--turf);background:var(--turf-soft);padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:16px}
.fb.ng{border-left-color:var(--red);background:var(--red-soft)}
.fb b{display:block;font-size:1.05rem}
.fb .ref{font-size:.85rem;color:var(--muted);margin-top:4px}
.keys{font-size:.8rem;color:var(--muted);margin-top:10px}

/* mock */
.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:1.3rem}
.timer.low{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:14px 0 18px}
.grid button{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;font-size:.8rem;font-weight:700;cursor:pointer;padding:0}
.grid button.ans{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid button.cur{outline:3px solid var(--flag);outline-offset:1px}
.grid button.ok{background:var(--turf);border-color:var(--turf);color:#fff}
.grid button.ng{background:var(--red);border-color:var(--red);color:#fff}
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 4px}
.score .big{font-size:3.4rem;font-weight:900;line-height:1}
.score .verdict{font-weight:900;font-size:1.2rem;padding:4px 14px;border-radius:6px}
.verdict.pass{background:var(--turf);color:#fff}
.verdict.fail{background:var(--red);color:#fff}
.review{list-style:none;padding:0;margin:0}
.review li{border-bottom:1px solid var(--line);padding:14px 0}
.review .q{margin:0 0 4px}
.review .meta{font-size:.88rem;color:var(--muted)}
.review .ans{font-weight:700}
.hist{list-style:none;padding:0;margin:0;font-size:.92rem}
.hist li{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0}
.empty{padding:28px 20px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="stripes" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <h1>ラクロス審判員（女子4級）<br>オンライン試験対策</h1>
    <p>JLA女子競技ルールブック 2026年度版（第1版）準拠<br>問題数 333問</p>
    <ul class="rules">
      <li><b>50</b>問</li><li><b>40</b>分</li><li><b>45</b>点以上で合格</li><li>はい／いいえの2択</li>
    </ul>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="plan" aria-selected="true">学習計画</button>
    <button role="tab" data-tab="practice" aria-selected="false">分野別練習</button>
    <button role="tab" data-tab="mock" aria-selected="false">模擬試験</button>
    <button role="tab" data-tab="weak" aria-selected="false">苦手復習</button>
  </nav>

  <main>
    <section id="v-plan"></section>
    <section id="v-practice" hidden></section>
    <section id="v-mock" hidden></section>
    <section id="v-weak" hidden></section>
  </main>
</div>

<script>
const UNITS = [
  {id:1,  t:"フィールド・ゴール・ボール・チーム", r:"ルール1・2・4・5"},
  {id:2,  t:"クロス・ユニフォーム・装具", r:"ルール3・6・付録H"},
  {id:3,  t:"キャプテン・コーチ・審判員・オフィシャル", r:"ルール7〜10"},
  {id:4,  t:"得点・試合時間・タイムアウト・延長戦", r:"ルール11・12"},
  {id:5,  t:"試合の開始と再開・ドロー・セルフスタート", r:"ルール13"},
  {id:6,  t:"交代・アウトオブバウンズ", r:"ルール14・15"},
  {id:7,  t:"オルタネイトポゼッション・同時ファール", r:"ルール16"},
  {id:8,  t:"ゴールサークル", r:"ルール17"},
  {id:9,  t:"リストレイニングライン・オフサイド", r:"ルール18"},
  {id:10, t:"マイナーファール", r:"ルール19"},
  {id:11, t:"メジャーファール", r:"ルール20"},
  {id:12, t:"シューティングスペース・3秒", r:"ルール20.A.19〜20・20.B.7〜8"},
  {id:13, t:"アドバンテージフラッグ", r:"ルール21"},
  {id:14, t:"ミスコンダクト・カード", r:"ルール22・23"},
  {id:15, t:"用語・シグナル・2026年度の変更点", r:"付録A・B・各ルールの削除/統合"}
];

const Q = [];
function add(u, list){ list.forEach(x => Q.push({u, q:x[0], a:x[1], e:x[2], r:x[3]})); }

add(1, [
 ["プレイングエリアは、エンドライン間の長さが91.4〜100m、サイドライン間の幅が48〜60mの長方形である。",1,"記載どおり。","1.A.2"],
 ["JLAの公式試合では、110m×60mのプレイングエリアが使用される。",0,"JLAの公式試合は100m×48〜60m（大会規約で変更可能）。","1.A.3"],
 ["フィールドのラインはすべて5〜10cmの幅でマークされる。",1,"記載どおり。白く塗ることが推奨される。","1.A.2"],
 ["フィールドラインの測定は、ラインの外側の端から外側の端までで行う。",0,"ライン幅の中心から中心で測定する。","1.A.1"],
 ["ゴールラインは、エンドラインから12mの地点にエンドラインと平行に引かれる。",1,"記載どおり。","1.A.5"],
 ["ゴールラインの長さは1.83mである。",1,"長さ1.83m、幅5cm（±5mm）。","1.A.5"],
 ["ゴールサークルは、ゴールラインの中心点から半径3mでマークされる。",1,"記載どおり。","1.A.8"],
 ["リストレイニングラインは、各ゴールラインからフィールド内側へ30mの位置に引かれる。",0,"ゴールラインから22m。","1.A.9"],
 ["センターサークルは、フィールドの中心点から半径9mで引く。",1,"記載どおり。","1.A.11"],
 ["センターラインの長さは3mである。",1,"リストレイニングラインと平行に長さ3m。","1.A.10"],
 ["11m MAのハッシュマークは7つあり、中心のハッシュマークから6m毎にマークされる。",0,"長さ31cmのハッシュマーク7つを4m毎にマークする。","1.A.7.a"],
 ["2つのドットは、エンドラインから4m内側で、15m MAの半円がGLEと交わる点と一直線上に位置する。",1,"直径15cmの印。","1.A.8"],
 ["プレー中、コーチウォークに入ることができるコーチは最大4名までである。",1,"審判員がコーチウォーク内を走る場合は審判員に進路を譲る。","1.A.14"],
 ["交代エリアは、フィールドの長さの中心点から左右6.5m（合計13m）である。",1,"サイドラインと平行に4mを計測する。","1.A.12"],
 ["選手のベンチ/椅子は、サイドラインから5m以上離れていればよい。",0,"サイドラインから7m以上、かつ交代エリアから4m以上離れていなければならない。","1.A.15"],
 ["選手やベンチスタッフは、プレー中にコーチウォークに入ることができる。",0,"選手およびその他のチーム/ベンチスタッフはチームベンチエリア内に留まり、プレー中にコーチウォークに入れない。","1.A.15"],
 ["観客席は原則としてサイドラインから4m以上離れなければならない。",1,"チームベンチやスコアテーブルの真後ろには観客は入れない。","1.A.4"],
 ["ゴールの柱の間隔は183cm、クロスバーの高さは地面から183cm（いずれも内寸）である。",1,"記載どおり。","2.A.2"],
 ["ゴールポストとクロスバーは、白または黄色に塗らなければならない。",0,"白またはオレンジ色。","2.A.2"],
 ["ゴールネットの網目は菱形6cm以下でなければならない。",0,"菱形4cm以下。","2.A.5"],
 ["ゴールスカートの使用は禁止されている。",0,"ゴールスカートは許可されている。","2.A.7"],
 ["ボールの重量は141.75〜148.83gである。",1,"周長は19.69〜20.32cm。","4.A.2"],
 ["ボールは白色でなければならない。",0,"任意の固有色でよい。","4.A.1"],
 ["同時にフィールド上にいる選手は、ゴールキーパーを含め最大12名である。",0,"最大10名（うち1名はゴールキーパーでもよい）。","5.A.3"],
 ["ゴールキーパーなしでプレーすることを選んだ場合、装具をつけていないフィールド選手もゴールサークルに入れるが、ルール17に従わなければならない。",1,"記載どおり。","5.A.3"]
]);

add(2, [
 ["フィールドクロスの全長は、エンドキャップを含めて90cm以上110cm以下である。",1,"記載どおり。","付録H B.1.a"],
 ["ゴールキーパークロスの全長は、90cm以上140cm以下である。",1,"記載どおり。","付録H B.2.a"],
 ["フィールドクロスの重量は600g以下である。",0,"567g以下（ストリング付きヘッドとシャフトの全重量）。","付録H B.1.a"],

let P = null;
function startPractice(ids, title, back){

}
function renderPQ(){
  const v = P.el;
  if(P.i >= P.ids.length){ return renderPEnd(); }
  const qi = P.ids[P.i], q = Q[qi];
  v.innerHTML = `<div class="qhead"><span>${esc(P.title)}</span><span>${P.i+1}／${P.ids.length}　正解<span id="pok">${P.ok}</span></span></div>
  <div class="qcard"><p class="qt">${esc(q.q)}</p></div>
  <div class="yn"><button data-a="1">はい</button><button data-a="0">いいえ</button></div>
  <div id="fbox"></div>

  <p class="keys">キーボード：1＝はい、2＝いいえ、Enter＝次へ</p>`;
  const answer = a => {
    if(P.answered) return;
    P.answered = true;
    const ok = (a===q.a);
    if(ok) P.ok++; else P.wrongs.push(qi);

    <div class="row" style="margin-bottom:12px"><button class="btn" id="next">${P.i+1<P.ids.length?"次の問題":"結果を見る"}</button></div>`;
    $("#next", v).addEventListener("click", next); $("#next", v).focus();
  };
  const next = () => { P.i++; P.answered=false; renderPQ(); };
  v.querySelectorAll(".yn button").forEach(b => b.addEventListener("click", () => answer(+b.dataset.a)));
  $("#quit", v).addEventListener("click", () => { P.i = P.ids.length; renderPQ(); });
  setKeys(e => { if(e.key==="1") answer(1); else if(e.key==="2") answer(0); else if(e.key==="Enter" && P.answered){ e.preventDefault(); next(); } });
}
function renderPEnd(){
  setKeys(null);
  const v = P.el, n = P.i ? Math.min(P.i, P.ids.length) : 0;
  const answeredCount = P.ok + P.wrongs.length;

}

/* ---------- mock exam ---------- */
let mockState = null;
const MOCK_N = 50, MOCK_SEC = 40*60;
function buildMock(){
  // バランス：はい25問・いいえ25問、各ユニットから偏りなく
  const yes = shuffle(Q.map((q,i)=>i).filter(i=>Q[i].a===1));
  const no  = shuffle(Q.map((q,i)=>i).filter(i=>Q[i].a===0));
  const pick = (pool, n) => {
    const out = [], byU = {};
    pool.forEach(i => { (byU[Q[i].u] = byU[Q[i].u] || []).push(i); });
    const keys = shuffle(Object.keys(byU));
    while(out.length < n){
      let added = false;
      for(const k of keys){ if(out.length>=n) break; if(byU[k].length){ out.push(byU[k].pop()); added = true; } }
      if(!added) break;
    }
    return out;
  };
  return shuffle(pick(yes, 25).concat(pick(no, 25)));
}
function renderMockHome(){
  setKeys(null);
  const v = $("#v-mock");
  let h = `<h2>模擬試験</h2><p class="lead">本番と同じ50問・40分です。問題の行き来や解答の変更ができ、最後に「採点する」を押すと結果が出ます。時間切れになると自動で採点します。はい・いいえは25問ずつ、全分野から出題します。</p>
  <button class="btn flag" id="startmock">模擬試験を始める（40分）</button>`;
  if(S.mocks.length){
    h += `<h3>これまでの結果</h3><ul class="hist">${S.mocks.slice().reverse().map(m=>`<li><span>${esc(m.d)}</span><span><b>${m.s}</b>／50　${m.s>=45?"合格ライン到達":"あと"+(45-m.s)+"点"}（${esc(m.t)}）</span></li>`).join("")}</ul>`;
  }
  v.innerHTML = h;
  $("#startmock", v).addEventListener("click", startMock);
}
function startMock(){
  mockState = {ids:buildMock(), ans:Array(MOCK_N).fill(null), cur:0, end:Date.now()+MOCK_SEC*1000, start:Date.now(), finished:false};
  clearInterval(timerId);
  timerId = setInterval(tick, 500);
  renderMockQ();
}
function remainSec(){ return Math.max(0, Math.round((mockState.end - Date.now())/1000)); }
function tick(){
  if(!mockState || mockState.finished){ clearInterval(timerId); return; }
  const r = remainSec();
  const t = document.getElementById("mtimer");
  if(t){ t.textContent = String(Math.floor(r/60)).padStart(2,"0")+":"+String(r%60).padStart(2,"0"); t.classList.toggle("low", r<=300); }
  if(r<=0) finishMock(true);
}
function renderMockQ(){
  const v = $("#v-mock"), m = mockState, qi = m.ids[m.cur], q = Q[qi];
  const answered = m.ans.filter(a=>a!==null).length;
  v.innerHTML = `<div class="qhead"><span>模擬試験　解答済み${answered}／50</span><span>残り <span class="timer" id="mtimer">--:--</span></span></div>
  <div class="qcard"><p class="keys" style="margin:0 0 6px">第${m.cur+1}問</p><p class="qt">${esc(q.q)}</p></div>
  <div class="yn"><button data-a="1" aria-pressed="${m.ans[m.cur]===1}">はい</button><button data-a="0" aria-pressed="${m.ans[m.cur]===0}">いいえ</button></div>
  <div class="row"><button class="btn ghost" id="prev" ${m.cur===0?"disabled":""}>前の問題</button><button class="btn ghost" id="nxt" ${m.cur===MOCK_N-1?"disabled":""}>次の問題</button><button class="btn flag" id="submit" style="margin-left:auto">採点する</button></div>
  <div class="grid" aria-label="問題一覧">${m.ids.map((x,i)=>`<button data-go="${i}" class="${m.ans[i]!==null?"ans":""}${i===m.cur?" cur":""}" aria-label="第${i+1}問">${i+1}</button>`).join("")}</div>
  <p class="keys">キーボード：1＝はい、2＝いいえ、←→＝前後の問題</p>`;
  tick();
  const choose = a => { m.ans[m.cur] = a; if(m.cur < MOCK_N-1){ m.cur++; } renderMockQ(); };
  v.querySelectorAll(".yn button").forEach(b => b.addEventListener("click", () => choose(+b.dataset.a)));
  $("#prev", v).addEventListener("click", () => { m.cur--; renderMockQ(); });
  $("#nxt", v).addEventListener("click", () => { m.cur++; renderMockQ(); });
  v.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => { m.cur = +b.dataset.go; renderMockQ(); }));
  $("#submit", v).addEventListener("click", () => {
    const un = m.ans.filter(a=>a===null).length;
    if(un && !confirm(`未解答が${un}問あります。採点しますか？`)) return;
    finishMock(false);
  });
  setKeys(e => {
    if(e.key==="1") choose(1); else if(e.key==="2") choose(0);
    else if(e.key==="ArrowLeft" && m.cur>0){ m.cur--; renderMockQ(); }
    else if(e.key==="ArrowRight" && m.cur<MOCK_N-1){ m.cur++; renderMockQ(); }
  });
}
function finishMock(timeout){
  const m = mockState; if(m.finished) return;
  m.finished = true; clearInterval(timerId); setKeys(null);
  let s = 0; const byU = {};
  m.ids.forEach((qi,i) => {
    const ok = m.ans[i]===Q[qi].a; if(ok) s++;
    if(m.ans[i]!==null) record(qi, ok);
    const u = Q[qi].u; byU[u] = byU[u] || {n:0,ok:0}; byU[u].n++; if(ok) byU[u].ok++;
  });
  const used = Math.min(MOCK_SEC, Math.round((Date.now()-m.start)/1000));
  const now = new Date();
  S.mocks.push({d:(now.getMonth()+1)+"/"+now.getDate()+" "+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0"), s, t:Math.floor(used/60)+"分"+(used%60)+"秒"});
  save();
  const v = $("#v-mock");
  const pass = s>=45;
  let h = `<h2>模擬試験の結果${timeout?"（時間切れ）":""}</h2>
  <div class="score"><span class="big">${s}<small style="font-size:1.2rem">／50</small></span><span class="verdict ${pass?"pass":"fail"}">${pass?"合格ライン到達":"不合格ライン"}</span><span>所要時間 ${Math.floor(used/60)}分${used%60}秒</span></div>
  <p class="note">${pass ? (s>=48 ? "本番でも十分な余裕があります。" : "合格ラインですが余裕は少なめです。間違えた分野をもう一度。") : "あと"+(45-s)+"点。下の間違えた問題と、正答率の低い分野から復習しましょう。"}</p>
  <div class="grid">${m.ids.map((qi,i)=>`<button data-r="${i}" class="${m.ans[i]===Q[qi].a?"ok":"ng"}" aria-label="第${i+1}問">${i+1}</button>`).join("")}</div>
  <h3>分野別の正答</h3><div class="tblwrap"><table class="nums"><thead><tr><th>分野</th><th>正答</th><th></th></tr></thead><tbody>
  ${Object.keys(byU).map(Number).sort((a,b)=>a-b).map(u=>`<tr><td>${u}．${esc(unitName(u))}</td><td>${byU[u].ok}／${byU[u].n}</td><td>${byU[u].ok<byU[u].n?`<button class="btn ghost" style="min-height:32px;padding:2px 10px;font-size:.82rem" data-pu="${u}">練習</button>`:""}</td></tr>`).join("")}
  </tbody></table></div>`;
  const wrong = m.ids.map((qi,i)=>({qi,i})).filter(x => m.ans[x.i]!==Q[x.qi].a);
  if(wrong.length){
    h += `<h3>間違えた問題（${wrong.length}問）</h3><ul class="review">${wrong.map(x=>`<li id="r${x.i}"><p class="q"><b>第${x.i+1}問</b>　${esc(Q[x.qi].q)}</p><div class="meta">あなたの解答：${m.ans[x.i]===null?"未解答":ynText(m.ans[x.i])}　正解：<span class="ans">${ynText(Q[x.qi].a)}</span><br>${esc(Q[x.qi].e)}（ルール ${esc(Q[x.qi].r)}）</div></li>`).join("")}</ul>`;
  }
  h += `<div class="row" style="margin-top:20px"><button class="btn flag" id="again">もう一度受ける</button><button class="btn ghost" id="home">模擬試験トップへ</button></div>`;
  v.innerHTML = h;
  v.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", () => { const el = document.getElementById("r"+b.dataset.r); if(el) el.scrollIntoView({behavior:"smooth", block:"center"}); }));
  v.querySelectorAll("[data-pu]").forEach(b => b.addEventListener("click", () => { show("practice"); startPractice(idsOf([+b.dataset.pu]), "ユニット"+b.dataset.pu+"："+unitName(+b.dataset.pu), "practice"); }));
  $("#again", v).addEventListener("click", startMock);
  $("#home", v).addEventListener("click", renderMockHome);
  window.scrollTo({top:0});
}

/* ---------- weak ---------- */
function weakIds(){ return Q.map((q,i)=>i).filter(i => S.res[i] && S.res[i].last===0); }
function renderWeak(){
  const v = $("#v-weak"), ids = weakIds();
  let h = `<h2>苦手復習</h2><p class="lead">最後に解いたときに間違えた問題だけを集めています。正解すると一覧から外れます。</p>`;
  if(!ids.length){
    h += `<div class="empty">いま復習が必要な問題はありません。分野別練習か模擬試験を解くと、間違えた問題がここに集まります。</div>`;
    v.innerHTML = h; return;
  }
  const byU = {}; ids.forEach(i => { byU[Q[i].u] = (byU[Q[i].u]||0)+1; });
  h += `<button class="btn flag" id="startweak">${ids.length}問をまとめて解く</button>
  <h3>分野別の内訳</h3><ul class="units">${Object.keys(byU).map(Number).sort((a,b)=>a-b).map(u=>`<li class="unit"><div><b>${u}．${esc(unitName(u))}</b></div><span>${byU[u]}問</span></li>`).join("")}</ul>`;
  v.innerHTML = h;
  $("#startweak", v).addEventListener("click", () => startPractice(ids, "苦手復習", "weak"));
}

renderPlan();
</script>
